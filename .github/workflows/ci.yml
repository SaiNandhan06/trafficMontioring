name: SkyGuard UAV CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Solidity Contracts
        run: |
          python blockchain/compile.py

      - name: Generate Synthetic Dataset & Video
        run: |
          python data/synthetic_generator.py

      - name: Run Test Suite
        run: |
          pytest tests/ -v --junitxml=test-results.xml

      - name: Run Edge & Blockchain Benchmarks
        run: |
          python scripts/benchmark_edge.py --iterations 10
          python scripts/benchmark_blockchain.py --txs 5
